name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Install dependencies (workspaces)
        run: |
          npm install
      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app?schema=nextauth
        run: |
          npx prisma generate --schema apps/web/prisma/schema.prisma
      - name: Build web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXTAUTH_SECRET: test_secret
          NEXTAUTH_URL: http://localhost:3001
          # Required for Prisma client instantiation during build
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app?schema=nextauth
          # Dummy OAuth provider envs to satisfy NextAuth provider config at build time
          GOOGLE_CLIENT_ID: test-google-id
          GOOGLE_CLIENT_SECRET: test-google-secret
          GITHUB_CLIENT_ID: test-github-id
          GITHUB_CLIENT_SECRET: test-github-secret
          # Internal API variables (not used during build, but safe defaults)
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8010
          API_INTERNAL_URL: http://localhost:8010
          MINT_TOKEN_SECRET: dev_mint_secret
        run: |
          npm run --workspace web build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
      - name: Import smoke
        run: |
          python - << 'PY'
          import fastapi, sqlalchemy, alembic, redis
          print('deps ok')
          PY
