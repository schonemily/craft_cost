services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8026:8025"

  api:
    build:
      context: ./apps/api
    environment:
      APP_NAME: craft_cost API
      APP_ENV: development
      CORS_ALLOW_ORIGINS: http://localhost:3001
      USE_LOCAL_DB: "true"
      LOCAL_DB_PATH: /data/users.json
      ADMIN_EMAILS: "bhargavcyber7@gmail.com"
      POSTGRES_URL: postgresql+psycopg://postgres:postgres@db:5432/app
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: exports
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      SESSION_SECRET: dev_session_secret
      PDF_SERVICE_URL: http://pdf:4000/render
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-noreply@craft_cost.local}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-604800}
      MINT_TOKEN_SECRET: ${MINT_TOKEN_SECRET:-dev_mint_secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      pdf:
        condition: service_started
      mailhog:
        condition: service_started
    ports:
      - "8010:8000"
    volumes:
      - ./data:/data

  worker:
    build:
      context: ./apps/worker
    environment:
      POSTGRES_URL: postgresql+psycopg://postgres:postgres@db:5432/app
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8010
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev_nextauth_secret}
      API_INTERNAL_URL: http://api:8000
      MINT_TOKEN_SECRET: ${MINT_TOKEN_SECRET:-dev_mint_secret}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app?schema=nextauth
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      EMAIL_FROM: ${MAIL_FROM:-noreply@craft_cost.local}
      NODE_ENV: production
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
    ports:
      - "3001:3000"
    command: >-
      sh -c "npx prisma generate --schema apps/web/prisma/schema.prisma && npx prisma db push --schema apps/web/prisma/schema.prisma --accept-data-loss && npm run --workspace web start"

  pdf:
    build:
      context: ./apps/pdf
    environment:
      NODE_ENV: production
    ports:
      - "4001:4000"

volumes:
  db_data:
  minio_data:
