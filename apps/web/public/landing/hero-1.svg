  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- grid -->
  <g opacity="0.2" stroke="#fff">
    <path d="M0 720H1280M0 640H1280M0 560H1280M0 480H1280M0 400H1280M0 320H1280M0 240H1280M0 160H1280M0 80H1280" stroke-width="1"/>
    <path d="M80 0V800M160 0V800M240 0V800M320 0V800M400 0V800M480 0V800M560 0V800M640 0V800M720 0V800M800 0V800M880 0V800M960 0V800M1040 0V800M1120 0V800M1200 0V800" stroke-width="1"/>
  </g>
  <!-- bars -->
  <g>
    <rect x="200" y="500" width="80" height="180" rx="8" fill="url(#accent)"/>
    <rect x="320" y="420" width="80" height="260" rx="8" fill="url(#brand)"/>
    <rect x="440" y="460" width="80" height="220" rx="8" fill="#60a5fa"/>
    <rect x="560" y="360" width="80" height="320" rx="8" fill="#34d399"/>
    <rect x="680" y="420" width="80" height="260" rx="8" fill="#f472b6"/>
