  <!-- pie -->
  <g transform="translate(980,420)">
    <circle r="110" fill="#1f2937" opacity="0.6"/>
    <path d="M0 0 L110 0 A110 110 0 0 1 33 -104 Z" fill="#60a5fa"/>
    <path d="M0 0 L33 -104 A110 110 0 0 1 -92 -60 Z" fill="#34d399"/>
    <path d="M0 0 L-92 -60 A110 110 0 0 1 0 110 Z" fill="url(#accent)"/>
